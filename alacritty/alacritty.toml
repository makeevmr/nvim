[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[window]
decorations = "Full"
opacity = 1.0
startup_mode = "Maximized"

[window.dimensions]
columns = 80
lines = 30

[window.padding]
x = 0
y = 0

[scrolling]
history = 50000
multiplier = 3

[selection]
save_to_clipboard = true

[general]
live_config_reload = true
import = [
    "~/.dotfiles/alacritty/colors.toml",
    "~/.dotfiles/alacritty/font.toml"
]

[terminal]
shell = "/usr/bin/zsh"
